name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & self-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Self-tests
        run: .build/debug/SuperNotesSelfTest
      - name: Build (Mac App Store edition)
        run: SUPERNOTES_DISTRIBUTION=appstore swift build --scratch-path .build-appstore
      - name: Self-tests (Mac App Store edition)
        run: .build-appstore/debug/SuperNotesSelfTest
